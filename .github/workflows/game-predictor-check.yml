# The Game Predictor's ESPN reads (game_predictor.py): the NBA and NFL
# schedules with their lines, and one game's summary (line, ESPN's
# projection, injury reports), printed so they can be checked -- the coding
# container can't reach ESPN. Then v2's NFL model on this week's games, its
# play-by-play tables built here from nflverse (the site's are built by the
# predictor cron). DraftKings' own feed (the moneylines on the page) and how
# its games match ESPN's. The record's replay of past games (game_record.py).
# Run by hand.
name: Game predictor check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  espn:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests numpy
      - name: Read ESPN's schedules and a game each
        shell: python
        run: |
          import json, sys
          sys.path.insert(0, ".")
          import game_predictor as gp
          for sport in gp.SPORTS:
              try:
                  slate = gp.slate(sport)
              except Exception as error:  # noqa: BLE001
                  print(f"{sport}: slate failed {type(error).__name__} {error}")
                  continue
              games = slate["games"]
              print(f"{sport}: {len(games)} games to come")
              for game in games[:6]:
                  print("  ", game["startsAt"], game["state"], game["away"]["abbr"], "@", game["home"]["abbr"], "|", json.dumps(game["line"]))
              upcoming = [game for game in games if game["state"] == "pre"]
              if not upcoming:
                  continue
              try:
                  found = gp._summary(sport, upcoming[0]["id"])
              except Exception as error:  # noqa: BLE001
                  print(f"  summary failed {type(error).__name__} {error}")
                  continue
              print("  summary line:", json.dumps(found["line"]), "| espn:", found["espn"], "| neutral:", found["neutral"])
              print("  injuries:", {team: [(item["name"], item["status"]) for item in items][:4] for team, items in found["injuries"].items()})
              print("  last five:", {team: [item["result"] for item in items] for team, items in found["lastFive"].items()})
              made = gp.prediction(sport, found, None)
              print("  line-only prediction:", made and {key: made[key] for key in ("winner", "chance", "margin", "total", "score", "ev", "blowout")})
          # Settling: a couple of finished games each, a summary apiece.
          from datetime import datetime, timedelta, timezone
          day = (datetime.now(timezone.utc) - timedelta(hours=29)).strftime("%Y%m%d")
          try:
              ids = [event["id"] for event in gp._espn("nba", "/scoreboard", {"dates": day}).get("events") or []][:3]
              print("nba finals", day, gp._finals("nba", ids))
              board = gp._espn("nfl", "/scoreboard")
              print("nfl week", (board.get("week") or {}).get("number"), "season type", (board.get("season") or {}).get("type"))
              ids = [event["id"] for event in board.get("events") or []][:3]
              print("nfl finals", gp._finals("nfl", ids))
          except Exception as error:  # noqa: BLE001
              print("finals failed", type(error).__name__, error)
      - name: DraftKings' own odds, matched to ESPN's games
        shell: python
        run: |
          import collections, json, sys, requests
          sys.path.insert(0, ".")
          import game_predictor as gp
          for sport, league in gp.DK_LEAGUES.items():
              try:
                  response = requests.get(gp.DK_URL.format(league=league), timeout=15,
                                          headers={"Accept": "application/json", "User-Agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"})
                  print(f"{sport}: DraftKings answered {response.status_code}, {len(response.content)} bytes")
                  payload = response.json()
              except Exception as error:  # noqa: BLE001
                  print(f"{sport}: DraftKings failed {type(error).__name__} {str(error)[:200]}")
                  continue
              print("  keys:", sorted(payload)[:20], "| events", len(payload.get("events") or []), "markets", len(payload.get("markets") or []),
                    "selections", len(payload.get("selections") or []))
              names = collections.Counter(str(m.get("name") or (m.get("marketType") or {}).get("name")) for m in payload.get("markets") or [])
              print("  market names:", names.most_common(8))
              for key in ("events", "markets", "selections"):
                  if payload.get(key):
                      print(f"  a {key[:-1]}:", json.dumps(payload[key][0])[:600])
              events = gp.parse_dk(payload)
              print(f"  {len(events)} games with a moneyline:", [(e["names"]["away"], "@", e["names"]["home"], e["moneyline"], e["live"]) for e in events[:4]])
              gp._memory.clear()
              for game in gp.slate(sport)["games"][:8]:
                  found = gp.dk_match(game, events)
                  print("   ", game["away"]["short"], "@", game["home"]["short"], "| DraftKings", found, "| page", (game["line"] or {}).get("moneyline"),
                        (game["line"] or {}).get("source", "espn"), "| opened", (game["line"] or {}).get("open"))
      - name: v2's NFL model on this week's games
        shell: python
        run: |
          import sys, traceback
          sys.path.insert(0, ".")
          from datetime import datetime, timedelta, timezone
          import game_predictor as gp
          import nfl_team_epa
          from backend.sports.nfl import finder
          now = datetime.now(timezone.utc)
          season = gp._nfl_season(now)
          try:
              table, last = nfl_team_epa.build(season), nfl_team_epa.build(season - 1)
              print("play-by-play tables:", season, len(table["teams"]), "team-games,", len(table["qbs"]), "QB-games |", season - 1, len(last["teams"]))
              context = gp.nfl_context(table, last, finder.games_index(), (now - timedelta(hours=5)).date(), season)
          except Exception:  # noqa: BLE001
              traceback.print_exc()
              raise SystemExit(0)
          games = [game for game in gp.slate("nfl", now)["games"] if game["state"] == "pre"][:8]
          for game in games:
              try:
                  found = gp._summary("nfl", game["id"])
                  built = gp.nfl_model_v2(found, context)
                  made = gp.prediction("nfl", found, built, None, now)
              except Exception:  # noqa: BLE001
                  traceback.print_exc()
                  continue
              ours, blend = made["predictions"]["ours"], made["predictions"]["blend"]
              line = (made.get("market") or {}).get("spread")
              print(f"{found['away']['abbr']} @ {found['home']['abbr']} | line home {line} | ours {ours and ours['margin']} "
                    f"({ours and ours['chance']['home']}) total {ours and ours['total']} | blend {blend['margin']} ({blend['chance']['home']}) "
                    f"| {made['confidence']} | EV best {made['ev']['best']}")
              print("   QBs:", built and built["starters"], "| warnings:", [item["text"] for item in made["warnings"]])
              print("   parts:", [(part["key"], part["points"], part["text"]) for part in made["factors"]])
              print("   write-up:", [point["text"] for point in (made.get("story") or {}).get("points", []) if point["key"] in ("teams", "home", "extras")])
      - name: The record's season so far, past games replayed (game_record.py)
        shell: python
        run: |
          import sys, traceback
          sys.path.insert(0, ".")
          from datetime import datetime, timedelta, timezone
          import game_predictor as gp
          import game_record
          import nfl_team_epa
          from backend.sports.nfl import finder
          now = datetime.now(timezone.utc)
          # The NFL: last weeks' finals from ESPN, each called as of its date (the ratings from nflverse here).
          try:
              season = gp._nfl_season(now)
              table, last, games = nfl_team_epa.build(season), nfl_team_epa.build(season - 1), finder.games_index()
              gp._nfl_v2 = lambda when: gp.nfl_context(table, last, games, (when - timedelta(hours=5)).date(), season)
              past = game_record.past_games("nfl", now, season)
              print("NFL finished games this season:", len(past))
              made = [game_record.replay("nfl", game, now) for game in past[-6:]]
              for entry in made:
                  if entry:
                      print(f"  {entry['day']} {entry['away']} @ {entry['home']}: took {entry[entry['side']]} {entry['chance']} (market {entry['market']}, {entry['price']}) "
                            f"{entry['confidence']} -> {entry['result']['away']}-{entry['result']['home']} correct {entry['result']['correct']} units {entry['result'].get('units')}")
              print("  summed:", {key: value for key, value in game_record.summary_of([entry for entry in made if entry], now).items() if key in ("games", "wins", "losses", "units")})
          except Exception:  # noqa: BLE001
              traceback.print_exc()
          # The NBA: does a finished game's summary still have its line and final (the season's games come from the stored season on the site)?
          try:
              for back in (2, 3):
                  day = (now - timedelta(days=back, hours=5)).strftime("%Y%m%d")
                  events = gp._espn("nba", "/scoreboard", {"dates": day}).get("events") or []
                  for event in events[:3]:
                      summary = gp._espn("nba", "/summary", {"event": event["id"]})
                      parsed = gp.summary_game("nba", event["id"], summary)
                      print(f"  NBA {day} {parsed['away'] and parsed['away']['abbr']} @ {parsed['home'] and parsed['home']['abbr']}: state {parsed['state']} "
                            f"line {parsed['line']} final {gp.final_of(summary)}")
          except Exception:  # noqa: BLE001
              traceback.print_exc()
      - name: NBA games on now, NBA.com's live feed against ESPN's
        shell: python
        run: |
          import sys, time, traceback
          sys.path.insert(0, ".")
          from datetime import datetime, timezone
          import requests
          import game_predictor as gp
          import nba_live
          now = datetime.now(timezone.utc)
          try:
              started = time.time()
              board = nba_live.board()
              print("NBA.com scoreboard:", len(board), "games in", round(time.time() - started, 2), "s; resting:", nba_live._resting["until"] > time.time())
              espn = gp._espn("nba", "/scoreboard", {"dates": gp._us_day(now), "limit": 100}).get("events") or []
              on = [gp._event("nba", event) for event in espn]
              on = [game for game in on if game["state"] == "in"]
              print("ESPN games on now:", len(on))
              for game in on[:3]:
                  response = requests.get(gp.ESPN + gp.PATHS["nba"] + "/summary", params={"event": game["id"]}, headers={"User-Agent": "Mozilla/5.0"}, timeout=12)
                  summary = response.json()
                  status = ((summary.get("header") or {}).get("competitions") or [{}])[0].get("status") or {}
                  plays = summary.get("plays") or []
                  last = plays[-1] if plays else {}
                  print(game["away"]["abbr"], "@", game["home"]["abbr"], "| ESPN clock:", status.get("type", {}).get("shortDetail"),
                        "| ESPN last play:", (last.get("period") or {}).get("number"), (last.get("clock") or {}).get("displayValue"), str(last.get("text"))[:60],
                        "| cache:", response.headers.get("Cache-Control"), "age:", response.headers.get("Age"))
                  fast = nba_live.live(game["home"]["abbr"], game["away"]["abbr"])
                  if fast:
                      print("   NBA.com clock:", fast["detail"], "score", fast["away"], "-", fast["home"], "| last play:", fast["plays"][-1]["period"]["number"] if fast["plays"] else None,
                            fast["plays"][-1]["clock"]["displayValue"] if fast["plays"] else None, (fast["plays"][-1]["text"] if fast["plays"] else "")[:60],
                            "| box players:", {side: len(people) for side, people in (fast["box"] or {}).items()})
                  else:
                      print("   NBA.com: no live game found for", nba_live.tricode(game["away"]["abbr"]), "@", nba_live.tricode(game["home"]["abbr"]))
                  found = gp.chart("nba", game["id"], now=now, store=None)
                  print("   chart source:", found.get("liveSource"), "| detail:", found.get("detail"), "| last:", (found.get("feed") or {}).get("last"))
          except Exception:  # noqa: BLE001
              traceback.print_exc()

      - name: The charts' data (a finished game's win probability, a game to come's line)
        shell: python
        run: |
          import json, sys, traceback
          sys.path.insert(0, ".")
          from datetime import datetime, timedelta, timezone
          import game_predictor as gp
          import game_live
          now = datetime.now(timezone.utc)
          day = (now - timedelta(hours=29)).strftime("%Y%m%d")
          for sport in gp.SPORTS:
              try:
                  board = gp._espn(sport, "/scoreboard", {"dates": day}) if sport == "nba" else gp._espn(sport, "/scoreboard")
                  done = [event["id"] for event in board.get("events") or []
                          if ((event.get("status") or {}).get("type") or {}).get("state") == "post"][:1]
                  for event_id in done:
                      summary = gp._espn(sport, "/summary", {"event": event_id})
                      points = summary.get("winprobability") or []
                      print(sport, "final", event_id, "win probability points:", len(points), "first:", points[:2])
                      print("   plays:", len(summary.get("plays") or []), "drives:", len(((summary.get("drives") or {}).get("previous") or [])),
                            "a play:", json.dumps(((summary.get("plays") or [{}])[0]))[:300])
                      found = gp.chart(sport, event_id, now=now, store=None)
                      print("   chart live points:", len(found["live"]), "first/last:", found["live"][:1], found["live"][-1:], "state:", found["state"])
                      clock = found.get("clock") or {}
                      print("   game clock:", len(clock.get("points") or []), "points, length", clock.get("length"), "now", clock.get("now"),
                            [item["label"] for item in clock.get("periods") or []], "first/last:", (clock.get("points") or [])[:2], (clock.get("points") or [])[-1:])
                      # The live parts (game_live.py): feed, swings, stretches, props.
                      feed = found.get("feed") or {}
                      print("   feed last:", feed.get("last"), "| run:", feed.get("run"), "| lead:", feed.get("lead"))
                      print("   quarters:", feed.get("quarters"))
                      print("   leaders:", feed.get("leaders"))
                      print("   swings:", [(item["when"], item["side"], item["delta"], item["text"][:60]) for item in found.get("swings") or []])
                      stretches = found.get("momentum") or []
                      print("   momentum:", len(stretches), "stretches, points", sum(item["home"] for item in stretches), "-", sum(item["away"] for item in stretches),
                            "vs final", found["home"].get("score"), "-", found["away"].get("score"))
                      box = game_live.box_score(sport, summary)
                      print("   box players:", {side: len(people) for side, people in box.items()}, "a line:", (box.get("home") or [{}])[0])
                      print("   props:", len(found.get("props") or []), (found.get("props") or [])[:2])
                  print(sport, "live list:", json.dumps(game_live.live_list(sport, now))[:600])
                  upcoming =[game for game in gp.slate(sport, now)["games"] if game["state"] == "pre"][:1]
                  for game in upcoming:
                      summary = gp._espn(sport, "/summary", {"event": game["id"]})
                      print(sport, "to come", game["id"], "pickcenter:", json.dumps((summary.get("pickcenter") or [None])[0])[:900])
                      found = gp.chart(sport, game["id"], now=now, store=None)
                      print("   chart now:", found["now"], "state:", found["state"])
              except Exception:  # noqa: BLE001
                  traceback.print_exc()
