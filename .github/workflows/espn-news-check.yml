# ESPN's player news, as player_news.py reads it (the Finder player page's
# News card): prints what comes back for a few players so the feed can be
# checked -- the coding container can't reach ESPN. Run by hand.
name: ESPN news check

on:
  workflow_dispatch:
    inputs:
      players:
        description: sport:ESPN player id pairs
        default: "nba:3975,nba:4433255,nfl:3139477,wnba:3149391"

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - name: Read ESPN's player news
        shell: python
        env:
          PLAYERS: ${{ github.event.inputs.players }}
        run: |
          import json, os, sys, urllib.request
          sys.path.insert(0, ".")
          import player_news
          for pair in os.environ.get("PLAYERS", "").split(","):
              sport, _, player = pair.strip().partition(":")
              url = player_news.NEWS_URL.format(game=player_news.GAMES[sport]) + f"?playerId={player}&limit=5"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "Mozilla/5.0"}), timeout=20) as reply:
                      data = json.loads(reply.read())
              except Exception as error:  # noqa: BLE001
                  print(f"{pair}: failed {type(error).__name__} {error}")
                  continue
              top = list(data) if isinstance(data, dict) else type(data).__name__
              raw = data.get("feed") if isinstance(data, dict) else data
              print(f"{pair}: keys {top}; {len(raw or [])} entries")
              if raw:
                  print("  entry keys:", sorted(raw[0].keys()))
              for item in player_news.news_items(data, None)[:3]:
                  print("  ", item["published"][:16], "|", item["source"], "|", item["headline"][:90], "|", item["text"][:160])
