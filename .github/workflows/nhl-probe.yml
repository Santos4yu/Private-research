name: NHL data check
on:
  push:
    branches: [claude/gracious-hypatia-h0zvdx]
    paths: ['.github/probe/**', '.github/workflows/nhl-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dotenv
      - run: python .github/probe/nhl_probe.py
