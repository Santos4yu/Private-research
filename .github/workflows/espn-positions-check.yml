# ESPN's own NBA positions (PG / SG / SF / PF / C), from its fantasy game's
# player list: what Defense vs position places players by (api/wnba.py
# _espn_positions). The coding container can't reach ESPN; this prints the
# list so it can be checked, one line a player:
#   POS,<season>,<ESPN player id>,<position>,<name>
# Run by hand.
name: ESPN positions check

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: Seasons to read (the year a season ends)
        default: "2027,2026"

permissions:
  contents: read

jobs:
  positions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read ESPN's fantasy player list
        shell: python
        env:
          SEASONS: ${{ github.event.inputs.seasons }}
        run: |
          import collections, json, os, urllib.request

          NAMES = {1: "PG", 2: "SG", 3: "SF", 4: "PF", 5: "C"}
          for season in [s.strip() for s in os.environ.get("SEASONS", "2027").split(",") if s.strip()]:
              for label, flt in (("active", {"filterActive": {"value": True}}), ("no filter", None)):
                  url = f"https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/{season}/players?view=players_wl"
                  headers = {"Accept": "application/json", "User-Agent": "Mozilla/5.0"}
                  if flt:
                      headers["x-fantasy-filter"] = json.dumps(flt)
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as reply:
                          data = json.loads(reply.read())
                          status = reply.status
                  except Exception as error:  # noqa: BLE001
                      print(f"SEASON {season} {label}: failed {type(error).__name__} {error}")
                      continue
                  items = data if isinstance(data, list) else data.get("players") or []
                  players = [(item.get("player") or item) for item in items if isinstance(item, dict)]
                  counts = collections.Counter(NAMES.get(p.get("defaultPositionId"), str(p.get("defaultPositionId"))) for p in players)
                  print(f"SEASON {season} {label}: HTTP {status}, {len(players)} players, by position {dict(counts)}")
                  if players:
                      print("KEYS", sorted(players[0].keys())[:40])
                  if label == "active":
                      for p in players:
                          print(f"POS,{season},{p.get('id')},{NAMES.get(p.get('defaultPositionId'), p.get('defaultPositionId'))},{p.get('fullName')}")
