# What PrizePicks' feed carries for the NBA: every league with "NBA" in its
# name, the stats each one posts and one player's lines across all of them.
# The NBA board reads one league of the partner feed (prizepicks_export_core
# _load_projection_rows, single_stat=true); a stat posted anywhere else never
# reaches the Finder. Run by hand, with the player to look for.
name: PrizePicks NBA check

on:
  workflow_dispatch:
    inputs:
      player:
        description: Part of a player's name to list every line of
        default: Zubac

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ask PrizePicks
        shell: python
        env:
          PLAYER: ${{ github.event.inputs.player }}
        run: |
          import collections, json, os, time, urllib.parse, urllib.request

          HEADERS = {"Accept": "application/json", "User-Agent": "Mozilla/5.0 (compatible; VORTEX-Private-Research/1.0)"}
          WANT = os.environ.get("PLAYER", "Zubac").casefold()

          def get(url):
              # PrizePicks answers 429 to quick repeats: a pause before each
              # ask, and a longer one (its Retry-After) before trying again.
              for attempt in range(6):
                  time.sleep(4)
                  request = urllib.request.Request(url, headers=HEADERS)
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          return response.status, json.loads(response.read())
                  except urllib.error.HTTPError as error:
                      if error.code != 429:
                          return error.code, None
                      wait = error.headers.get("Retry-After")
                      time.sleep(min(60, int(wait)) if str(wait or "").isdigit() else 10 * (attempt + 1))
                  except Exception as error:  # noqa: BLE001
                      return type(error).__name__, None
              return 429, None

          def feed(base, url):
              data, included, pages, started = [], [], 0, time.time()
              while url and pages < 80 and time.time() - started < 240:
                  status, page = get(url)
                  if not isinstance(page, dict) or not isinstance(page.get("data"), list):
                      return status, data, included, pages
                  data += page["data"]
                  included += page.get("included") or []
                  pages += 1
                  url = (page.get("links") or {}).get("next")
                  url = urllib.parse.urljoin(base, url) if url else None
              return 200, data, included, pages

          def report(label, base, url):
              status, data, included, pages = feed(base, url)
              print(f"\n=== {label}: status {status}, {len(data)} lines over {pages} pages")
              players = {str(item.get("id")): item.get("attributes") or {} for item in included if item.get("type") == "new_player"}
              stats = collections.Counter()
              mine = []
              for projection in data:
                  attrs = projection.get("attributes") or {}
                  relationships = projection.get("relationships") or {}
                  league = ((relationships.get("league") or {}).get("data") or {}).get("id")
                  pid = ((relationships.get("new_player") or {}).get("data") or {}).get("id")
                  player = players.get(str(pid)) or {}
                  stats[(attrs.get("stat_type"), attrs.get("status"))] += 1
                  name = str(player.get("display_name") or player.get("name") or "")
                  if WANT in name.casefold():
                      mine.append((name, league, player.get("league"), attrs.get("stat_type"), attrs.get("stat_display_name"), attrs.get("line_score"),
                                   attrs.get("odds_type"), attrs.get("status"), attrs.get("allowed_wager_types"), attrs.get("start_time")))
              for (stat, state), count in sorted(stats.items(), key=lambda item: (str(item[0][0]), str(item[0][1]))):
                  print(f"  {stat!s:40} {state!s:12} {count}")
              print(f"  -- lines for '{WANT}': {len(mine)}")
              for line in sorted(mine, key=lambda item: (str(item[3]), str(item[5]))):
                  print("    ", " | ".join(str(part) for part in line))

          partner = "https://partner-api.prizepicks.com/"
          status, leagues = get(partner + "leagues")
          print(f"leagues: status {status}")
          nba = []
          for item in (leagues or {}).get("data") or []:
              name = str((item.get("attributes") or {}).get("name") or "")
              if "NBA" in name.upper() and "WNBA" not in name.upper():
                  nba.append((str(item.get("id")), name))
                  print(f"  {item.get('id')}: {name} active={(item.get('attributes') or {}).get('active')}")
          for league_id, name in nba or [("7", "NBA")]:
              report(f"partner {name} ({league_id}) single_stat", partner, f"{partner}projections?single_stat=true&league_id={league_id}")
          report("partner NBA (7) without single_stat", partner, f"{partner}projections?league_id=7&per_page=1000")
          public = "https://api.prizepicks.com/"
          report("public app feed NBA (7)", public, f"{public}projections?league_id=7&per_page=250&single_stat=true")
