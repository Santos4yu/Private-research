<!doctype html><html lang="en" data-theme="obsidian"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mobile controls fixture</title>
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/gamelog-premium.css"><link rel="stylesheet" href="/src/mobile-app.css"><link rel="stylesheet" href="/src/sports-app.css"><link rel="stylesheet" href="/src/gamelog-fix.css"><link rel="stylesheet" href="/src/research-game-page.css"></head><body>
<p>UI fixture · sample lines, not live picks</p>
<script type="module">
const page=new DOMParser().parseFromString(await(await fetch('/index.html')).text(),'text/html');
const overlay=page.querySelector('#gamelog-overlay');overlay.hidden=false;document.body.append(overlay);
document.getElementById('gamelog-title').textContent='Aaron Nola';
document.getElementById('gamelog-prop-badge').textContent='HA';
document.getElementById('gamelog-player-cutout').innerHTML='<img src="https://img.mlbstatic.com/mlb-photos/image/upload/w_180/v1/people/605400/headshot/67/current" alt="">';
document.getElementById('gamelog-close').onclick=()=>{overlay.hidden=true;};
document.getElementById('gamelog-stat-tabs').innerHTML='<button>K</button><button>OUTS</button><button>ER</button><button class="active">HA</button><button>BB</button>';
document.getElementById('gamelog-line-value').textContent='2.5';
const source=await(await fetch('/app.js')).text();
const start=source.indexOf('let postedLinesToken =');const end=source.indexOf('async function fetchGameLogDetails',start);
const rows=[2.5,3.5,4.5,5.5,6.5].map((line,i)=>({player:'Aaron Nola',stat:'Hits Allowed',line,odds_type:i===0?'goblin':i===1?'standard':'demon'}));
const state={player:'Aaron Nola',line:2.5};
const fn=new Function('gameLogState','requestFinderFeed','nameKey','pitcherFinderStat','escapeHtml','setGameLogPreviewLine',source.slice(start,end)+';return loadGameLogPostedLines;')(state,async()=>rows,s=>s.toLowerCase(),s=>({label:s}),s=>s,n=>{state.line=n;document.getElementById('gamelog-line-value').textContent=n;});
await fn('Hits Allowed');
const panel=document.getElementById('gamelog-filter-panel');
document.getElementById('gamelog-filter-toggle').onclick=()=>{panel.hidden=!panel.hidden;};
document.getElementById('gamelog-filter-close').onclick=()=>{panel.hidden=true;};
document.getElementById('gamelog-season-row').innerHTML='<button>2024</button><button>2025</button><button class="active">2026</button>';
const chart=document.getElementById('gamelog-chart');
if(location.search.includes('page')) {
 const research=document.createElement('section');research.id='panel-research';document.body.append(research);
 const mount=source.slice(source.indexOf('function mountResearchGamePage()'),source.indexOf('function wireGameLogModal()'));
 new Function('els','setResearchView','switchTab','gameLogState','setGameLogCount','state','renderGameLogChart',mount+';mountResearchGamePage();')({panelResearch:research,gamelogOverlay:overlay,gamelogClose:document.getElementById('gamelog-close')},()=>{},()=>{},state,()=>{},{},()=>{});
 document.getElementById('research-games').hidden=false;document.getElementById('research-games-empty').hidden=true;
}
const height=chart.clientHeight-64;chart.style.setProperty('--plot-height',height+'px');
chart.innerHTML='<div class="gamelog-chart-track" style="--bar-width:60px;--game-count:3">'+[1,4,4].map(n=>'<div class="gl-col"><div class="gl-track"><div class="gl-bar-shell"><div class="gl-bar" style="height:'+height*n/8+'px"><span class="gl-val">'+n+'</span></div></div></div><span class="gl-opponent-logo">MIA</span></div>').join('')+'</div>';

</script></body></html>
