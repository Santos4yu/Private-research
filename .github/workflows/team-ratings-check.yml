# Which way of ranking NBA offenses and defenses matches PickFinder's?
# Its cards on Nov 11, 2026 (offense, defense): CLE 12 / 19, NY 10 / 6,
# WSH 23 / 17, IND 21 / 14. This works this season's ranks out several
# ways from ESPN's box scores (team turnovers in or out, each team's own
# possessions or the game's), asks NBA.com and Basketball-Reference for
# their own ratings, and prints how many of the eight each one matches.
# Run by hand.
name: Team ratings check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - name: Rank the teams every way
        shell: python
        run: |
          import json, re, sys, traceback
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor
          import requests
          sys.path.insert(0, ".")
          from backend.sports.wnba import league

          PF = {"CLE": (12, 19), "NY": (10, 6), "WSH": (23, 17), "IND": (21, 14)}
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}

          def ranks(values, high_first=True):
              order = sorted(values, key=lambda team: values[team], reverse=high_first)
              return {team: order.index(team) + 1 for team in order}

          def show(name, off, deff, top=False):
              ro, rd = ranks(off), ranks(deff, high_first=False)
              hits = sum((ro.get(t), rd.get(t)) == want for t, want in PF.items())
              each = sum((ro.get(t) == want[0]) + (rd.get(t) == want[1]) for t, want in PF.items())
              cells = " ".join(f"{t} {ro.get(t)}/{rd.get(t)}" for t in PF)
              print(f"{name:44} {each}/8 match | {cells}")
              if top:
                  print("    off:", [(t, round(off[t], 1)) for t in sorted(off, key=ro.get)])
                  print("    def:", [(t, round(deff[t], 1)) for t in sorted(deff, key=rd.get)])

          teams = league.team_directory("nba")
          by_name = {row["name"]: abbr for abbr, row in teams.items()}
          print("PickFinder (off/def):", " ".join(f"{t} {o}/{d}" for t, (o, d) in PF.items()))

          # ESPN's box scores, team totals (team turnovers and rebounds included).
          try:
              season = league.current_season(league="nba")
              listing = [g for g in league.schedule(season, teams, "nba") if g["completed"] and g["type"] == 2]
              def summary(game):
                  try:
                      return game, league.espn("/summary", {"event": game["id"]}, 20, league="nba")
                  except Exception:  # noqa: BLE001
                      return game, None
              with ThreadPoolExecutor(max_workers=12) as pool:
                  found = list(pool.map(summary, listing))
              games, named = [], False
              for game, data in found:
                  if not data:
                      continue
                  sides = {}
                  for side in (data.get("boxscore") or {}).get("teams") or []:
                      abbr = (side.get("team") or {}).get("abbreviation")
                      stats = {item.get("name"): item.get("displayValue") for item in side.get("statistics") or []}
                      if not named:
                          print("ESPN team stat names:", sorted(stats))
                          named = True
                      pair = lambda key: [float(x) for x in str(stats.get(key) or "0-0").split("-")[:2]]
                      fgm, fga = pair("fieldGoalsMade-fieldGoalsAttempted")
                      ftm, fta = pair("freeThrowsMade-freeThrowsAttempted")
                      tpm, tpa = pair("threePointFieldGoalsMade-threePointFieldGoalsAttempted")
                      num = lambda key: float(stats.get(key) or 0)
                      sides[abbr] = {"fgm": fgm, "fga": fga, "ftm": ftm, "fta": fta, "tpm": tpm,
                                     "oreb": num("offensiveRebounds"), "dreb": num("defensiveRebounds"),
                                     "to": num("turnovers"), "tto": num("totalTurnovers") or num("turnovers"),
                                     "pts": 2 * fgm + tpm + ftm}
                  if len(sides) == 2 and game["home"] in sides and game["away"] in sides:
                      games.append((game, sides))
              print("ESPN games read:", len(games), "of", len(listing))

              def trips(box, to_key, ft=0.44):
                  return box["fga"] - box["oreb"] + box[to_key] + ft * box["fta"]

              def bref(own, opp):
                  one = lambda a, b: a["fga"] + 0.4 * a["fta"] - 1.07 * (a["oreb"] / max(1, a["oreb"] + b["dreb"])) * (a["fga"] - a["fgm"]) + a["tto"]
                  return 0.5 * (one(own, opp) + one(opp, own))

              def rate(poss_of, last=None):
                  pts, opp, op, dp, n = defaultdict(float), defaultdict(float), defaultdict(float), defaultdict(float), defaultdict(int)
                  per_team = defaultdict(list)
                  for game, sides in games:
                      for team in (game["home"], game["away"]):
                          per_team[team].append((game, sides))
                  for team, rows in per_team.items():
                      rows = sorted(rows, key=lambda row: row[0]["date"])[-last:] if last else rows
                      for game, sides in rows:
                          other = game["away"] if team == game["home"] else game["home"]
                          own_poss, opp_poss = poss_of(sides[team], sides[other])
                          pts[team] += sides[team]["pts"]; opp[team] += sides[other]["pts"]
                          op[team] += own_poss; dp[team] += opp_poss; n[team] += 1
                  return ({t: 100 * pts[t] / op[t] for t in pts}, {t: 100 * opp[t] / dp[t] for t in pts},
                          {t: pts[t] / n[t] for t in pts}, {t: opp[t] / n[t] for t in pts})

              avg = lambda key, ft=0.44: (lambda a, b: ((trips(a, key, ft) + trips(b, key, ft)) / 2,) * 2)
              own = lambda key: (lambda a, b: (trips(a, key), trips(b, key)))
              o, d, ppg, oppg = rate(avg("to"))
              show("game poss, players' turnovers (ours now)", o, d)
              show("points a game", ppg, oppg)
              show("game poss, team turnovers in", *rate(avg("tto"))[:2], top=True)
              show("own poss, team turnovers in (NBA.com-like)", *rate(own("tto"))[:2], top=True)
              show("own poss, players' turnovers", *rate(own("to"))[:2])
              show("Basketball-Reference poss formula", *rate(lambda a, b: (bref(a, b),) * 2)[:2])
              show("game poss, team turnovers, 0.475 free throws", *rate(avg("tto", 0.475))[:2])
              show("last 10 games, team turnovers in", *rate(avg("tto"), last=10)[:2])
              show("last 5 games, team turnovers in", *rate(avg("tto"), last=5)[:2])
          except Exception:  # noqa: BLE001
              traceback.print_exc()

          # NBA.com's own team ratings.
          try:
              params = {"MeasureType": "Advanced", "PerMode": "PerGame", "Season": "2026-27", "SeasonType": "Regular Season",
                        "LeagueID": "00", "LastNGames": "0", "Month": "0", "OpponentTeamID": "0", "PaceAdjust": "N", "Period": "0",
                        "PlusMinus": "N", "Rank": "N", "TeamID": "0", "DateFrom": "", "DateTo": "", "GameSegment": "", "Location": "",
                        "Outcome": "", "SeasonSegment": "", "VsConference": "", "VsDivision": "", "Conference": "", "Division": "",
                        "GameScope": "", "PlayerExperience": "", "PlayerPosition": "", "StarterBench": "", "TwoWay": "0", "ShotClockRange": ""}
              headers = {**UA, "Referer": "https://www.nba.com/", "Origin": "https://www.nba.com", "Accept": "application/json, text/plain, */*",
                         "x-nba-stats-origin": "stats", "x-nba-stats-token": "true"}
              answer = requests.get("https://stats.nba.com/stats/leaguedashteamstats", params=params, headers=headers, timeout=20).json()
              table = answer["resultSets"][0]
              rows = [dict(zip(table["headers"], row)) for row in table["rowSet"]]
              to_abbr = {row["name"]: abbr for abbr, row in teams.items()}
              off = {to_abbr.get(r["TEAM_NAME"], r["TEAM_NAME"]): r["OFF_RATING"] for r in rows}
              deff = {to_abbr.get(r["TEAM_NAME"], r["TEAM_NAME"]): r["DEF_RATING"] for r in rows}
              show("NBA.com OFF_RATING / DEF_RATING", off, deff, top=True)
              off = {to_abbr.get(r["TEAM_NAME"], r["TEAM_NAME"]): r["E_OFF_RATING"] for r in rows if "E_OFF_RATING" in r}
              deff = {to_abbr.get(r["TEAM_NAME"], r["TEAM_NAME"]): r["E_DEF_RATING"] for r in rows if "E_DEF_RATING" in r}
              if off:
                  show("NBA.com estimated ratings", off, deff)
          except Exception as error:  # noqa: BLE001
              print("NBA.com:", type(error).__name__, str(error)[:200])

          # Basketball-Reference's advanced team table (inside an HTML comment).
          try:
              page = requests.get("https://www.basketball-reference.com/leagues/NBA_2027.html", headers=UA, timeout=20)
              print("Basketball-Reference:", page.status_code, len(page.text))
              html = page.text.replace("<!--", "").replace("-->", "")
              start = html.find('id="advanced-team"')
              block = html[start:html.find("</table>", start)] if start >= 0 else ""
              off, deff = {}, {}
              for row in re.findall(r"<tr[^>]*>(.*?)</tr>", block, re.S):
                  cells = dict(re.findall(r'data-stat="([a-z_]+)"[^>]*>(.*?)</t[dh]>', row, re.S))
                  name = re.sub(r"<[^>]+>", "", cells.get("team", "")).replace("*", "").strip()
                  if name in by_name and cells.get("off_rtg") and cells.get("def_rtg"):
                      off[by_name[name]], deff[by_name[name]] = float(cells["off_rtg"]), float(cells["def_rtg"])
              if off:
                  show("Basketball-Reference ORtg / DRtg", off, deff, top=True)
              else:
                  print("Basketball-Reference: no advanced table found")
          except Exception as error:  # noqa: BLE001
              print("Basketball-Reference:", type(error).__name__, str(error)[:200])

          # ESPN's own team stats: anything that reads like a rating or possessions.
          try:
              core = "https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/seasons/2027/types/2/teams/{}/statistics"
              data = requests.get(core.format(teams["NY"]["id"]), headers=UA, timeout=20).json()
              wanted = []
              for category in ((data.get("splits") or {}).get("categories") or []):
                  for stat in category.get("stats") or []:
                      if re.search(r"rating|possess|pace|efficien", stat.get("name", ""), re.I):
                          wanted.append((category.get("name"), stat.get("name"), stat.get("value"), stat.get("rank")))
              print("ESPN core NY rating-like stats:", wanted)
          except Exception as error:  # noqa: BLE001
              print("ESPN core:", type(error).__name__, str(error)[:200])
